services:
  postgres:
    image: postgres:17-alpine
    container_name: smartflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: smartflow_db
      POSTGRES_USER: smartflow_user
      POSTGRES_PASSWORD: smartflow_local_password

    ports:
      - "5433:5432"

    volumes:
      - smartflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U smartflow_user -d smartflow_db"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  smartflow_postgres_data: